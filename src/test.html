<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookmark Extender</title>

    <style>
        body {
            width: 350px;
            min-height: 200px;
            font-family: Arial, sans-serif;
            padding: 15px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <h2>Bookmark Extender</h2>

    <button id="loadBookmarks">
        Load Bookmarks
    </button>

    <pre id="output">Click the button.</pre>

    <script>
        document
            .getElementById("loadBookmarks")
            .addEventListener("click", async () => {

                const output = document.getElementById("output");

                output.textContent = "Loading...";

                try {
                    const response = await chrome.runtime.sendMessage({
                        type: "GET_BOOKMARKS"
                    });

                    if (!response?.success) {
                        throw new Error(
                            response?.error || "No response from background"
                        );
                    }

                    output.textContent =
                        JSON.stringify(response.tree, null, 2);

                } catch (error) {
                    console.error(error);

                    output.textContent =
                        "ERROR:\n" + error.message;
                }
            });
    </script>

</body>
</html>
