<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Extender Settings</title>
    <style>
        body {
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 420px;
            margin: 32px auto;
            padding: 0 16px;
            color: #202124;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 4px;
        }
        p.subtitle {
            margin-top: 0;
            color: #5f6368;
            font-size: 13px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 16px;
        }
        .row-label {
            font-size: 14px;
        }
        .row-desc {
            font-size: 12px;
            color: #5f6368;
            margin-top: 2px;
        }
        /* Simple toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #ccc;
            border-radius: 22px;
            transition: background-color 0.15s ease;
        }
        .slider::before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.15s ease;
        }
        input:checked + .slider {
            background-color: #0067c0;
        }
        input:checked + .slider::before {
            transform: translateX(18px);
        }
        .saved {
            font-size: 12px;
            color: #188038;
            margin-top: 10px;
            visibility: hidden;
        }
        .saved.show {
            visibility: visible;
        }
    </style>
</head>
<body>
    <h1>Bookmark Extender</h1>
    <p class="subtitle">Settings</p>

    <div class="row">
        <div>
            <div class="row-label">Show bookmark bar on webpages</div>
            <div class="row-desc">Turn off to stop injecting the multi-row bar into pages you visit.</div>
        </div>
        <label class="switch">
            <input type="checkbox" id="enabledToggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="saved" id="savedMsg">Saved</div>

    <script src="options.js"></script>
</body>
</html>
