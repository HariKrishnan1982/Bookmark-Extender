<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Extender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 520px;
      background: var(--pp-bg, linear-gradient(145deg, #0f0c29 0%, #1e1a4a 50%, #24243e 100%));
      font-family: 'Inter', sans-serif;
      color: var(--pp-text, #e2d9ff);
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    
    .popup-header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(167,139,250,0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .popup-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .popup-logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 14px rgba(124,58,237,0.45);
    }

    .popup-logo-text h1 {
      font-size: 14px;
      font-weight: 700;
      color: #e2d9ff;
    }

    .popup-logo-text p {
      font-size: 11px;
      color: rgba(196,181,253,0.5);
      margin-top: 1px;
    }

    .popup-count-badge {
      background: rgba(124,58,237,0.2);
      border: 1px solid rgba(167,139,250,0.25);
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #a78bfa;
    }

    
    .popup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px 18px;
    }

    .popup-btn {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(167,139,250,0.18);
      background: rgba(167,139,250,0.06);
      color: #c4b5fd;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .popup-btn:hover {
      background: rgba(167,139,250,0.14);
      border-color: rgba(167,139,250,0.35);
      transform: translateY(-1px);
    }

    .popup-btn.primary {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(124,58,237,0.4);
    }

    .popup-btn.primary:hover {
      box-shadow: 0 6px 20px rgba(124,58,237,0.6);
    }

    
    .popup-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 18px;
    }

    .stat-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(167,139,250,0.1);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }

    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: #a78bfa;
      line-height: 1;
    }

    .stat-label {
      font-size: 10.5px;
      color: rgba(196,181,253,0.45);
      margin-top: 4px;
    }

    
    .popup-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: rgba(196,181,253,0.45);
      padding: 14px 18px 8px;
    }

    .popup-recent {
      padding: 0 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .recent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(167,139,250,0.09);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .recent-item:hover {
      background: rgba(167,139,250,0.1);
      border-color: rgba(167,139,250,0.2);
    }

    .recent-favicon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(167,139,250,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .recent-favicon img {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .recent-info {
      flex: 1;
      min-width: 0;
    }

    .recent-title {
      font-size: 12.5px;
      font-weight: 500;
      color: #e2d9ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-domain {
      font-size: 10.5px;
      color: rgba(196,181,253,0.4);
      margin-top: 1px;
    }

    .recent-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    
    .popup-tip {
      margin: 0 18px 16px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.15);
      font-size: 11.5px;
      color: rgba(196,181,253,0.55);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    kbd {
      background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 5px;
      padding: 1px 6px;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      color: #a78bfa;
    }

    .empty-recent {
      text-align: center;
      padding: 20px;
      color: rgba(196,181,253,0.35);
      font-size: 12.5px;
    }

    
    .popup-themes {
      padding: 10px 18px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .popup-themes-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(196,181,253,0.35);
      margin-bottom: 8px;
    }

    .popup-theme-swatches {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }

    .popup-theme-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      position: relative;
    }

    .popup-theme-dot:hover {
      transform: scale(1.2);
    }

    .popup-theme-dot.active {
      border-color: rgba(255,255,255,0.6);
      box-shadow: 0 0 8px var(--dot-color, rgba(255,255,255,0.4));
    }

    .popup-theme-dot[title]:hover::after {
      content: attr(title);
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 9.5px;
      padding: 3px 7px;
      border-radius: 5px;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  
  <div class="popup-header">
    <div class="popup-logo">
      <div class="popup-logo-icon">📚</div>
      <div class="popup-logo-text">
        <h1>Bookmark Extender</h1>
        <p>Your smart bookmark manager</p>
      </div>
    </div>
    <div class="popup-count-badge" id="total-count">0</div>
  </div>

  
  <div class="popup-actions">
    <button class="popup-btn primary" id="btn-save-page">
      ➕ Save Page
    </button>
    <button class="popup-btn" id="btn-open-panel">
      📂 Open Panel
    </button>
  </div>

  
  <div class="popup-stats" id="stats-grid">
    <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-cats">0</div><div class="stat-label">Categories</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-today">0</div><div class="stat-label">Today</div></div>
  </div>

  
  <div class="popup-section-title">Recent Bookmarks</div>
  <div class="popup-recent" id="recent-list"></div>

  
  <div class="popup-tip">
    💡 Press <kbd>Alt</kbd> + <kbd>B</kbd> to toggle the panel on any page
  </div>

  
  <div class="popup-themes">
    <div class="popup-themes-label">🎨 Theme</div>
    <div class="popup-theme-swatches" id="theme-swatches"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
